name: Windows WinUI build

on:
  push:
    branches:
      - main
      - feat/windows-winui3-port
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test cross-platform core
        run: dotnet test windows/GlassPhotos.Core.Tests/GlassPhotos.Core.Tests.csproj --configuration Release

      - name: Build WinUI app
        run: dotnet build windows/GlassPhotos.WinUI/GlassPhotos.WinUI.csproj --configuration Release -p:Platform=x64

      - name: Publish portable Windows build
        shell: pwsh
        run: ./windows/publish-windows.ps1 -Architecture x64

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Photos-Windows-x64
          path: dist/Glass-Photos-Windows-x64.zip
          if-no-files-found: error
