name: Glass Photo Viewer macOS build

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "OSx/**"
      - "windows/**"
      - ".github/workflows/macos.yml"
      - ".github/workflows/release-promotion.yml"
  pull_request:
    paths:
      - "OSx/**"
      - "windows/**"
      - ".github/workflows/macos.yml"
      - ".github/workflows/release-promotion.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test, build, and verify universal macOS app
        run: ./OSx/build-release.sh

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Photo-Viewer-macOS
          path: dist/Glass-Photo-Viewer-v*-macOS.zip
          if-no-files-found: error
